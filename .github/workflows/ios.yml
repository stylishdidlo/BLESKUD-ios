name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Diagnostics (before)
        run: |
          xcodegen --version
          echo "===== project.yml ====="
          cat project.yml

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Patch pbxproj to Xcode 15 format (objectVersion 60)
        run: |
          PBX=BleSkud.xcodeproj/project.pbxproj
          echo "Before patch:"
          grep -m1 "objectVersion" "$PBX" || true

          # XcodeGen 2.46.0 emits objectVersion 77 regardless of project.yml.
          # Downgrade to objectVersion 60 (Xcode 15) so Xcode 15.4 can open it.
          sed -i '' 's/objectVersion = 77;/objectVersion = 60;/g' "$PBX"
          sed -i '' 's/compatibilityVersion = "Xcode 15.3";/compatibilityVersion = "Xcode 14.0";/g' "$PBX"

          # Also handle any other compatibilityVersion value XcodeGen might emit
          sed -i '' 's/compatibilityVersion = "Xcode 16.0";/compatibilityVersion = "Xcode 14.0";/g' "$PBX"

          echo "After patch:"
          grep -m1 "objectVersion" "$PBX" || true
          grep -m1 "compatibilityVersion" "$PBX" || true

      - name: Build (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project BleSkud.xcodeproj \
            -scheme BleSkud \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/BleSkud.app Payload/
          zip -r BleSkud-unsigned.ipa Payload
          ls -la BleSkud-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BleSkud-ipa
          path: BleSkud-unsigned.ipa
          retention-days: 30
