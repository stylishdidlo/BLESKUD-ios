name: Build iOS IPA

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Diagnostics
        run: |
          xcodegen --version
          echo "===== project.yml ====="
          cat project.yml
          echo "======================="
          echo "===== objectVersion in generated pbxproj ====="
          grep -m1 "objectVersion" BleSkud.xcodeproj/project.pbxproj || true

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show objectVersion AFTER generation
        run: |
          grep -m1 "objectVersion" BleSkud.xcodeproj/project.pbxproj || true

      - name: Build (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project BleSkud.xcodeproj \
            -scheme BleSkud \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/BleSkud.app Payload/
          zip -r BleSkud-unsigned.ipa Payload
          ls -la BleSkud-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BleSkud-ipa
          path: BleSkud-unsigned.ipa
          retention-days: 30
